server {
  listen 80;
  server_name _;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https:; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src 'self' https://iframe.mediadelivery.net https://*.bunny.net; connect-src 'self' https: wss:; report-uri /api/security/csp-report; report-to csp-endpoint; upgrade-insecure-requests" always;
  add_header Reporting-Endpoints 'csp-endpoint="http://localhost:8080/api/security/csp-report"' always;
  add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"http://localhost:8080/api/security/csp-report"}]}' always;
  add_header Access-Control-Allow-Origin "http://localhost:8080" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace, rather than append to, any client-supplied forwarding chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
